[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchcad"
version = "0.1.0"
description = "Parametric, local-first watch CAD from a text brief, with no third-party dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "watchcad contributors" }]
keywords = ["watch", "cad", "parametric", "stl", "gltf", "dxf", "design"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# Intentionally empty: the core and the tests are standard library only.

[project.scripts]
watchcad = "watchcad.cli:main"

[tool.setuptools]
packages = ["watchcad"]
include-package-data = false

[tool.setuptools.package-data]
# The studio assets live next to the package in the source tree.  Editable
# installs and `python3 -m watchcad` serve them directly from ../web.
"watchcad" = []
